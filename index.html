<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Perfil Github</title>

    <style>
        :root {
            --principal: #03223F;
            --destaque: #038BBB;
            --escuro: #010D23;
        }

        * { 
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html, body {
            background-color: var(--escuro);
        }

        header {
            color: white; 
            background-color: var(--escuro); 

            padding: 20px; 

            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center;
        }

        header > p {
            background-color: var(--principal); 
            color: white; 
            opacity: 0.;

            font-size: 1.2em; 
            font-weight: bold; 
            
            border-radius: 8px; 

            margin: 0px;
            padding: 8px 13px; 
        }

        #apresentacao {
            background-color: var(--principal);
            color: white;

            margin: 10px;
            padding: 10px;

            border-radius: 10px;
        }

        #tecnologias {
            background-color: var(--principal);
            color: white;

            height: 300px;

            margin: 10px;
            padding: 10px;

            border-radius: 10px;
        }

        .badges {
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;

            margin-top: 15px;
        }

        #status {
            background-color: var(--principal);
            
            padding: 10px;
            margin: 10px;

            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bruno Bortolon da Silva</h1>
        <p>B</p>
    </header>

    <main>
        <section id="apresentacao">
            <h2>🙋‍♂️ Sobre Mim</h2>

            <article style="margin-top: 15px;">
                <p>
                    Estudante de Sistemas de Informação no IFRS - Campus Vacaria 🎓 | Técnico em Informática 💻 | Interessado em desenvolvimento e tecnologia 🚀
                </p>
            </article>
        </section>

        <section id="status">
            <div>
                <img src="https://raw.githubusercontent.com/bbortolondasilva/bbortolondasilva/stats-output/stats.svg" height="150" alt="stats graph"  />

                <img src="https://raw.githubusercontent.com/bbortolondasilva/bbortolondasilva/languages-output/languages.svg" height="150" alt="languages graph"  />
            </div>
        </section>

        <section id="tecnologias">
            <h2>🚀 Tecnologias</h2>

            <div class="badges">
                <img src="https://img.shields.io/badge/Java-ED8B00?style=for-the-badge&logo=openjdk&logoColor=white" alt="Java">

                <img src="https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white" alt="Python">

                <img src="https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black" alt="JavaScript">

                <img src="https://img.shields.io/badge/HTML5-E34F26?style=for-the-badge&logo=html5&logoColor=white" alt="HTML">

                <img src="https://img.shields.io/badge/CSS3-1572B6?style=for-the-badge&logo=css3&logoColor=white" alt="CSS">

                <img src="https://img.shields.io/badge/Git-F05032?style=for-the-badge&logo=git&logoColor=white" alt="Git">
            </div>
        </section>
    </main>
</body>
</html>
